name: Release 🚀

# release-please reads the Conventional Commits on main and keeps one release pull request open
# (`chore: release main`) that bumps apps/api and apps/studio and writes their changelogs. Merging it
# creates the tags `api-vX.Y.Z` and `studio-vX.Y.Z` and the GitHub Releases.
#
# It needs a GitHub App (repository secrets RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY, permissions
# contents and pull requests: write). A pull request or a push made with GITHUB_TOKEN does not start CI,
# so the required checks would wait forever; the App token does. Without the secrets this workflow only
# says so and succeeds.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.7"

jobs:
  release:
    name: Release 🚀
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check the release app 🔑
        id: app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RELEASE_APP_ID is not set, so no release pull request is made. See docs/releases.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the App token 🔑
        if: steps.app.outputs.configured == 'true'
        id: token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Release pull request 🚀
        if: steps.app.outputs.configured == 'true'
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps `version` in apps/api/pyproject.toml but not the copy of it in uv.lock, so
      # `uv sync --locked` (and the required checks) would fail on the release pull request itself. The same
      # goes for the workspace versions in package-lock.json. Fix both on the pull request branch; the push
      # is made with the App token, so CI runs on it.
      - name: Checkout the release branch 📚
        if: steps.app.outputs.configured == 'true' && steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.token.outputs.token }}
      - name: Set up uv 🐍
        if: steps.app.outputs.configured == 'true' && steps.release.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/api
          enable-cache: false
      - name: Set up Node 🟢
        if: steps.app.outputs.configured == 'true' && steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Refresh the lock files 🔒
        if: steps.app.outputs.configured == 'true' && steps.release.outputs.prs_created == 'true'
        run: |
          (cd apps/api && uv lock --upgrade-package formlens)
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet; then
            echo "The lock files already match."
            exit 0
          fi
          git config user.name "form-lens-release[bot]"
          git config user.email "form-lens-release[bot]@users.noreply.github.com"
          git add apps/api/uv.lock package-lock.json
          git commit -m "chore(release): refresh the lock files"
          git push
