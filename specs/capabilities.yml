# yaml-language-server: $schema=https://raw.githubusercontent.com/JanSzewczyk/spec-driven-development/v2.0.4/plugins/sdd/schemas/capabilities.schema.json
# SDD configuration. Keys and values: references/capabilities.md in the sdd plugin.
# `projects` is rewritten by /sdd:doctor init; everything else is yours and is never overwritten.
format: 3

projects:
  - name: api
    kind: backend
    path: apps/api
    stack: Python, FastAPI (uv)
  - name: "@form-lens/studio"
    kind: web
    path: apps/studio
    stack: TypeScript, Next.js 16, React 19, Vitest, Storybook (npm)
  - name: "@form-lens/api-client"
    kind: library
    path: packages/api-client
    stack: TypeScript, Orval-generated client (npm)

implementation:
  default: in-session         # who implements a task: skill:<name> | agent:<name> | command:<shell> | in-session
  projects:                   # per project, e.g. `api: agent:python-developer`
    api: skill:python:run-python-task
    "@form-lens/studio": in-session
  isolation:                  # each task in its own sub-session, worktree and branch
    worktree:
      merge: pr               # pr: a PR per task, a human merges | auto: rebase + fast-forward
      parallel: 3             # tasks running at once

actions:                      # who runs a git action: skill:<name> | agent:<name> | command:<shell>
  branch: skill:git-workflow:create-branch
  commit: skill:git-workflow:create-commit
  pr: skill:git-workflow:create-pull-request

review:
  tests: run                  # run | skip
  publish: ask                # ask: confirm the commit and PR after READY | off
  default: auto               # audit flow: auto (by stack) | skill:<name> | agent:<name>
  projects:                   # per project, e.g. `web: skill:react-review`
    api: agent:python:python-reviewer
    "@form-lens/studio": agent:nextjs:code-reviewer
  checks: []                  # run on every review, e.g. [agent:qa]
  ci: on                      # on | off: the sdd-check GitHub workflow (/sdd:doctor init asks)

generated:                    # globs left out of every diff and never flagged
  - "**/*.generated.*"
  - "**/generated/**"
  - "**/__snapshots__/**"
  - "**/*.snap"
  - "**/pnpm-lock.yaml"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/uv.lock"
  - "**/poetry.lock"
  - "**/pubspec.lock"
  - "**/Podfile.lock"
