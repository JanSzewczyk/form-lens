name: CI ✅

# Pushes to main and pull requests; a branch without a pull request runs CI from the Actions tab
# (workflow_dispatch). Running on every push too would test each pull request commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # new advisories appear without a new commit

permissions:
  contents: read

# The event is part of the group, so the weekly run never cancels a push to main or the other way
# round; only a newer commit of the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"

# The Python service lives in apps/api: `run` steps start there. `uses` steps are set by hand below.
defaults:
  run:
    working-directory: apps/api

jobs:
  # Which apps does the change touch? Nx answers from the project graph and the declared inputs of each project
  # (a changed apps/api/openapi.json reaches the generated client and the Studio; a workflow change reaches all).
  # The weekly run and a manual run test everything.
  affected:
    name: Affected 🔍
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # nx-set-shas finds the last successful run on main
    defaults:
      run:
        working-directory: .
    outputs:
      api: ${{ steps.projects.outputs.api }}
      studio: ${{ steps.projects.outputs.studio }}
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the base commit of the change must be in the clone
          persist-credentials: false
      - name: Set up Node 🟢
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies ⚙️
        run: npm ci
      - name: Find the base commit 🔎
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: nrwl/nx-set-shas@v5.1.0
      - name: List the affected apps 🔍
        id: projects
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
            projects="$(npx nx show projects --affected --json)"
          else
            projects="$(npx nx show projects --json)"
          fi
          echo "Affected projects: $projects"
          {
            echo "api=$(jq 'any(. == "api")' <<< "$projects")"
            echo "studio=$(jq 'any(. == "@form-lens/studio" or . == "@form-lens/api-client")' <<< "$projects")"
          } >> "$GITHUB_OUTPUT"

  api-check:
    name: API check 🐍
    needs: affected
    if: needs.affected.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/api
      - name: Install dependencies ⚙️
        run: uv sync --locked
      - name: Run checks ✅
        run: make check
      - name: Coverage summary 📊
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Apart from the checks: a new advisory fails this job, not the code checks, and both results show.
  # It always runs, whatever the change touched: advisories appear without a commit.
  audit:
    name: Audit 🔒
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/api
      - name: Install dependencies ⚙️
        run: uv sync --locked
      - name: Audit Python dependencies 🔒
        run: make audit
      - name: Set up Node 🟢
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Audit npm dependencies 🔒
        working-directory: .
        run: npm audit --omit=dev --audit-level=high

  # Contract tooling: Spectral on the spec, oasdiff against main, Schemathesis against a live server.
  api-contract:
    name: API contract 📜
    needs: affected
    if: needs.affected.outputs.api == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # api-breaking reads origin/main:openapi.json
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/api
      - name: Install dependencies ⚙️
        run: uv sync --locked --group api
      - name: Run API checks 📜
        run: make api-check

  api-docker:
    name: API Docker 🐳
    needs: affected
    if: needs.affected.outputs.api == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx 🐳
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build image 🏗️
        uses: docker/build-push-action@v7.4.0
        with:
          context: apps/api # the service folder, so its .dockerignore applies as in a local build
          load: true
          tags: formlens:local # the image apps/api/compose.yaml runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image has no model: starting it with an empty models folder must fail, loudly and at once,
      # with the `model_load_failed` event that tells the operator to run `make download-models`.
      # (A model is 0.6 GB and never goes into the image or into CI.) For the same reason there is no
      # `docker compose up --wait` here: without a model the service never becomes healthy.
      - name: The image refuses to start without the model 🚫
        run: |
          mkdir "$RUNNER_TEMP/empty-models"
          status=0
          timeout 120 docker run --rm --read-only --tmpfs /tmp \
            --volume "$RUNNER_TEMP/empty-models:/models:ro" --env MODELS_PATH=/models \
            formlens:local > "$RUNNER_TEMP/start.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/start.log"
          # Separate lines: under `bash -e` a failed `test` in the middle of an `&&` list does not stop the step.
          test "$status" -ne 0 # it failed
          test "$status" -ne 124 # on its own, not by hanging until the timeout
          grep --quiet model_load_failed "$RUNNER_TEMP/start.log"
      # The start-up check above stops at `missing_model_files`, before any Docling import, so it passes
      # even if the image cannot import Docling or torch. This is the step that proves the image can.
      # It runs without --read-only, --tmpfs and the models mount, so it shows no failure that only the
      # read-only container causes.
      - name: The image can import Docling and torch 📦
        run: docker run --rm formlens:local python -c "import docling.document_converter, torch"
      - name: Validate compose.yaml 🧾
        run: docker compose config --quiet # compose.yaml is valid, with its defaults

  # The Studio (apps/studio) and the client generated from the API contract (packages/api-client).
  # Nx runs the project targets; the generated client is checked against apps/api/openapi.json.
  studio:
    name: Studio check ⚛️
    needs: affected
    if: needs.affected.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 🟢
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies ⚙️
        run: npm ci
      - name: Run checks ✅
        run: npx nx run-many -p studio api-client -t generate:check type-check biome:ci knip:ci test:unit build
        env:
          SKIP_ENV_VALIDATION: "true"

  studio-docker:
    name: Studio Docker 🐳
    needs: affected
    if: needs.affected.outputs.studio == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx 🐳
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build image 🏗️
        uses: docker/build-push-action@v7.4.0
        with:
          context: . # the repository root: the image installs the npm workspace
          file: apps/studio/Dockerfile
          load: true
          tags: formlens-studio:local
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio
      - name: The image serves its health route 🩺
        run: |
          docker run --detach --name studio --publish 3000:3000 formlens-studio:local
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:3000/api/health && exit 0
            sleep 1
          done
          docker logs studio
          exit 1

  # The one required check for the code. A job skipped because its app is not affected counts as passed; a job
  # that failed or was cancelled does not, and neither does a crash of the job that decides what is affected.
  # `if: always()` is what makes it run (and fail) when something upstream failed instead of being skipped.
  check:
    name: Check ✅
    needs: [affected, api-check, api-contract, api-docker, studio, studio-docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: . # no checkout here, so apps/api does not exist
    steps:
      - name: Every job passed or was not needed ✅
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "A job failed or was cancelled." >&2; exit 1 ;;
          esac

  # Informational: the free-threaded build exposes races the GIL hides. Never blocks a merge.
  # Switched off: `uv sync --locked --python 3.15t` cannot install the runtime dependencies. torch and mlx
  # have free-threaded wheels, but `av` (abi3 wheels only, and its sdist needs pkg-config), `docling-parse`
  # (cp315 wheels only) and pyarrow (no Linux wheel for 3.15 at all) have none, so the job would only
  # fail. Turn it on (remove `if: false`) when `uv sync --python 3.15t` works again.
  free-threaded:
    name: Free-threaded 🧵
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv 🐍
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: apps/api
          python-version: "3.15t"
      - name: Install dependencies ⚙️
        run: uv sync --locked
      - name: Run tests 🧪
        run: uv run pytest
