version: 2
# A cooldown lets a broken or compromised release be pulled before it reaches a pull request.
# Commit messages follow Conventional Commits: build(deps) for packages and images, ci(deps) for
# workflow actions. Major versions get a pull request of their own; the rest come grouped.
#
# Not covered: the Spectral, oasdiff and pip-audit pins in apps/api/Makefile. Bump them by hand.
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The npm workspace (apps/studio and packages/api-client) is one lock file at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Bumps the uv image in the Dockerfile only; tests/test_tooling.py fails until UV_VERSION in
  # ci.yml and release.yml matches, so update all in the same pull request.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/studio
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
